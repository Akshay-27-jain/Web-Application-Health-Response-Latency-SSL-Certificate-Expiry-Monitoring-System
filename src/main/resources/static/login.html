<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — UptimePulse</title>
  <meta name="description" content="Access your UptimePulse web health, latency and SSL certificate monitoring dashboard.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-surface-alt);
      border-radius: var(--radius-lg);
      padding: 0.3rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-default);
    }
    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
    }
    .auth-tab.active {
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .password-wrap {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 0.25rem;
    }
    .password-toggle:hover {
      color: var(--text-main);
    }
    .error-banner {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-md);
      color: var(--danger-text);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      align-items: center;
      gap: 0.5rem;
    }
    .quick-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="card" style="padding: 2.25rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-modal);">
      
      <!-- Brand Logo -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none;">
          <div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div>
          <span style="font-family: var(--font-heading); font-size: 1.35rem; font-weight: 800; color: var(--text-main);">UptimePulse</span>
        </a>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem;">
          Website Health, Latency &amp; SSL Monitoring
        </p>
      </div>

      <!-- Navigation Tabs -->
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tabRegisterBtn" class="auth-tab" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Error Notification Banner -->
      <div id="errorBanner" class="error-banner">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Invalid email or password.</span>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" onsubmit="handleAuthLogin(event)">
        <!-- Honeypot for bot spam protection -->
        <input type="text" name="website_hp" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="developer@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em;">
            One-Click Demo Access
          </span>
          <div class="quick-login-grid">
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillQuickCreds('user@uptimepulse.com', 'password123')">
              <i class="fa-solid fa-user"></i> Demo User
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillQuickCreds('admin@uptimepulse.com', 'admin123')">
              <i class="fa-solid fa-user-shield"></i> Admin User
            </button>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleAuthRegister(event)">
        <!-- Honeypot for bot spam protection -->
        <input type="text" name="website_hp" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="alex@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="regPassword" class="form-input" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.25rem;">
          By registering, you agree to our <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%;">
          Create Free Account
        </button>
      </form>

      <!-- Footer navigation -->
      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.82rem;">
        <a href="/" style="color: var(--text-muted); text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> Return to Homepage
        </a>
      </div>

    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tabLoginBtn').classList.toggle('active', isLogin);
      document.getElementById('tabRegisterBtn').classList.toggle('active', !isLogin);
      hideError();
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    }

    function fillQuickCreds(email, password) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = password;
      hideError();
      toast('Demo credentials auto-filled!', 'info');
    }

    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      document.getElementById('errorText').textContent = msg;
      banner.style.display = 'flex';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    function handleAuthLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      apiFetch('/auth/login', 'POST', { email, password }, false)
        .then(data => {
          storeToken(data);
          toast(`Welcome back, ${data.fullName || data.email}!`, 'success');
          setTimeout(() => { window.location.href = '/'; }, 500);
        })
        .catch(err => {
          showError(err.message || 'Login failed. Please check credentials.');
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
        });
    }

    function handleAuthRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      const fullName = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      apiFetch('/auth/register', 'POST', { fullName, email, password }, false)
        .then(data => {
          storeToken(data);
          toast(`Account created! Welcome, ${fullName}!`, 'success');
          setTimeout(() => { window.location.href = '/'; }, 500);
        })
        .catch(err => {
          showError(err.message || 'Registration failed. Email may already be in use.');
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = 'Create Free Account';
        });
    }
  </script>
</body>
</html>
