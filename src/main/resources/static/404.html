<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | UptimePulse</title>
  <meta name="description" content="The page you were looking for does not exist on UptimePulse.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="align-items: center; justify-content: center; min-height: 100vh;">

  <div class="container" style="max-width: 580px; text-align: center; padding: 2rem;">
    <div class="card" style="padding: 3.5rem 2rem;">
      <div style="width: 5rem; height: 5rem; border-radius: var(--radius-xl); background: var(--primary-light); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 2.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>

      <div class="hero-pill" style="margin-bottom: 1rem;">
        <i class="fa-solid fa-circle-exclamation"></i> Error 404
      </div>

      <h1 style="font-size: 2rem; margin-bottom: 0.75rem; color: var(--text-main);">Page Not Found</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        The target URL or resource you requested could not be located on our probe network. It may have been moved, renamed, or temporarily decommissioned.
      </p>

      <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Homepage</a>
        <a href="/status.html" class="btn btn-secondary"><i class="fa-solid fa-chart-line"></i> View System Status</a>
      </div>

      <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-subtle);">
        UptimePulse Synthetic Monitoring Platform &bull; System Operational
      </div>
    </div>
  </div>

</body>
</html>
